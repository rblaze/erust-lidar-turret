[package]
name = "lidar-turret"
version = "0.1.0"
edition = "2024"

[dependencies]
firmware = { path = "../../firmware" }

cortex-m = { version = "0.7", features = [
    "critical-section-single-core",
    "inline-asm",
] }
cortex-m-rt = "0.7"
critical-section = "1"
embedded-hal = "1"
rtt-target = "0.6"
stm32g0-hal = { git = "https://github.com/rblaze/erust-stm32g0-hal.git", features = [
    "stm32g071",
] }

# stm32g0-hal = { path = "../../../erust-stm32g0-hal", features = [
#     "stm32g071",
# ] }

[[bin]]
name = "lidar-turret"
test = false
bench = false
doctest = false
