[package]
name = "lidar-turret"
version = "0.1.0"
edition = "2024"

[dependencies]
firmware = { path = "../../firmware" }

cortex-m = { version = "0.7", features = [
    "critical-section-single-core",
    "inline-asm",
] }
cortex-m-rt = "0.7"
rtt-target = "0.6"

[[bin]]
name = "lidar-turret"
test = false
bench = false
doctest = false
